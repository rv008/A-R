name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # The invitation is already the artifact — there is nothing to compile.
      # Only the two things a guest actually loads get published, so the
      # README and the generators stay out of the served site.
      # CNAME travels with the artifact rather than living only in the repo
      # settings: an Actions deploy that publishes without one can drop the
      # custom domain, which takes the site down until it is set again.
      - name: Stage the site
        run: |
          mkdir _site
          cp index.html CNAME _site/
          cp -r assets _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
